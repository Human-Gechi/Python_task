services:
  db:
    image: postgres:15
    container_name: quotes_db
    restart: unless-stopped
    environment:
      POSTGRES_: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST: ${DB_HOST}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      retries: 5

  app:
    image: human434/quotes
    container_name: quotes_application
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 13575
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_KEY: ${API_KEY}
      SENDER_PASSWORD: ${SENDER_PASSWORD}
      SENDER_EMAIL: ${SENDER_EMAIL}
      URL: ${URL}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: python Zenquotes/Wellness.py

volumes:
  postgres_data:
